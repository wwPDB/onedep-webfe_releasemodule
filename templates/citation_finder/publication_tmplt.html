<section class="pub %(stripe)s%(preprint_class)s" data-q="%(search)s">
<div class="pub-head">
<input type="checkbox" class="pub-select" aria-label="Select publication %(doi_label)s" data-entry-ids="%(entry_ids)s" />
<input type="button" class="pub-toggle" value="Expand" aria-expanded="false" />
<span class="n">#%(index)s</span>
%(badge)s
<span class="count">%(count_label)s</span>
%(unwanted)s
</div>
%(rows)s
<table class="pub-entries"></table>
</section>
